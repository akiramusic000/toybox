[package]
name = "toybox-rs"
version = "0.1.1"
edition = "2024"
description = "A CLI tool and library for interacting with the API of Toybox."
readme = "README.md"
license = "MIT"
repository = "https://github.com/akiramusic000/toybox"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
directories = "6.0"
keyring = { version = "4.1" }
md5 = "0.8.1"
rand = "0.10.2"
reqwest = { version = "0.13.4", features = ["json", "multipart"] }
rpassword = "7.5.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.21"
tokio = { version = "1.53", features = ["full"] }
uuid = { version = "1.24", features = ["serde", "v4"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = "1.0"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = "1.0"
